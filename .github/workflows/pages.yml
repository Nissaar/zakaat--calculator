name: Deploy to Cloudflare Pages

# main            -> production (zakaat-calculator.pages.dev, and zakaat.info once the name points there)
# pull request    -> a preview address for that branch (same-repo PRs only: a fork never gets the token)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # A pull request from a fork has no secrets: skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Create the project the first time (harmless when it exists).
          npx --yes wrangler@4 pages project create zakaat-calculator --production-branch main || echo "project exists or could not be created: the deploy below says which"
          npx --yes wrangler@4 pages deploy dist --project-name zakaat-calculator --branch "$BRANCH" --commit-message "$GITHUB_SHA" 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
